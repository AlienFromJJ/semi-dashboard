name: 데이터 자동 업데이트 & 배포

on:
  schedule:
    # 평일 30분마다 (UTC 기준 — 한국장·미국장 모두 포함)
    - cron: "*/30 * * * 1-5"
    # 주말 하루 2회 (메모리 가격·거시지표 반영)
    - cron: "0 0,12 * * 0,6"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: 데이터 수집
        run: python scripts/update_data.py
      - name: 데이터 커밋 (메모리 가격 이력 누적 보존)
        run: |
          git config user.name "semi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
